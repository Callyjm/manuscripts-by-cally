<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MELLOWAY</title>
<meta name="description" content="MELLOWAY — original art and exclusive creative works.">

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    text-align: center;
    color: #e5e4ec;
    background-color: #07152e;
    background-image: url('./melloway-blue-pattern.jpg?v=2');
    background-position: center top;
    background-size: 100% auto;
    background-repeat: repeat-y;
}

/* MELLOWAY ORIGINAL LARGE LOGO */
header {
    width: 100%;
    max-width: 1024px;
    margin: 0 auto;
}

header img {
    display: block;
    width: 100%;
    height: auto;
}

/* COLLECTIONS */
main {
    position: relative;
    width: 100%;
    padding: 25px 20px 70px;
}

.collections {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
}

.collection {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 105px;
    padding: 24px 12px;
    background: rgba(5, 18, 43, 0.55);
    border: none;
    border-radius: 3px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    text-decoration: none;
    transition: background 0.3s ease, transform 0.3s ease;
}

.collection:hover {
    background: rgba(30, 57, 95, 0.75);
    transform: translateY(-2px);
}

.collection h2 {
    margin: 0;
    font-size: 21px;
    font-weight: normal;
    letter-spacing: 3px;
}

.gold h2 {
    color: #d4af37;
}

.silver h2 {
    color: #c0c0c0;
}

.bronze h2 {
    color: #cd7f32;
}

.platinum h2 {
    color: #e1e5ec;
}

.one-of-one h2 {
    color: #b66a83;
    letter-spacing: 2px;
}

.one-of-one {
    grid-column: 1 / -1;
    width: calc(50% - 9px);
    justify-self: center;
    min-height: 90px;
}

/* MOBILE DISPLAY */
@media (max-width: 600px) {
    header img {
        width: 100%;
    }

    main {
        padding: 18px 14px 45px;
    }

    .collections {
        gap: 12px;
    }

    .collection {
        min-height: 88px;
        padding: 18px 8px;
    }

    .collection h2 {
        font-size: 16px;
        letter-spacing: 1.5px;
    }

    .one-of-one {
        min-height: 78px;
    }
}

/* ACCESSIBILITY */
@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }

    .collection {
        transition: none;
    }
}
</style>
</head>

<body>

<header aria-label="MELLOWAY brand logo">
    <img
        src="./melloway-blue-header.jpg?v=2"
        alt="MELLOWAY original interlocking M X logo"
    >
</header>

<main>
    <div class="collections">

        <a href="gold.html" class="collection gold">
            <h2>GOLD</h2>
        </a>

        <a href="silver.html" class="collection silver">
            <h2>SILVER</h2>
        </a>

        <a href="bronze.html" class="collection bronze">
            <h2>BRONZE</h2>
        </a>

        <a href="platinum.html" class="collection platinum">
            <h2>PLATINUM</h2>
        </a>

        <a href="one-of-one.html" class="collection one-of-one">
            <h2>ONE OF ONE</h2>
        </a>

    </div>
</main>

</body>
</html>
