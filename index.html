<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MELLOWAY</title>

<style>
* {
    box-sizing: border-box;
}

html {
    margin: 0;
    padding: 0;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #07152e;
    font-family: Georgia, serif;
    text-align: center;
    color: #f5f5ff;
}

/* OPENING BRANDING SCREEN */
.brand-hero {
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    background-color: #07152e;
    background-image: url('./melloway-blue-pattern.jpg');
    background-position: center center;
    background-repeat: repeat;
    background-size: 280px auto;
    padding: 0 0 30px;
}

/* LARGE MELLOWAY LOGO */
.header-logo {
    width: 100%;
    margin: 0 auto;
}

.header-logo img {
    display: block;
    width: 100%;
    max-width: 1024px;
    height: auto;
    margin: 0 auto;
}

/* COLLECTION SECTION */
.collection-section {
    width: 100%;
    background-color: #07152e;
    padding: 65px 15px 35px;
}

/* COLLECTION GRID */
.collections {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 30px 15px;
}

/* CLICKABLE COLLECTIONS */
.collection {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 75px;
    text-decoration: none;
    background: transparent;
}

/* COLLECTION HEADINGS */
.collection h2,
.one-of-one-display h2 {
    margin: 0;
    color: #f5f5ff;
    font-size: 21px;
    font-weight: normal;
    letter-spacing: 3px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.65);
}

/* ONE OF ONE DISPLAY */
.one-of-one-display {
    grid-column: 1 / -1;
    width: 100%;
    padding: 45px 10px 40px;
    text-align: center;
}

/* THICK BLACK LOGO FRAME */
.logo-frame {
    display: inline-block;
    width: 100%;
    max-width: 450px;
    padding: 14px;
    margin: 25px auto;
    background-color: #000000;
    border: 2px solid #c0c0c0;
    box-shadow: 0 8px 25px rgba(0,0,0,0.8);
}

/* LOGO INSIDE FRAME */
.logo-frame img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    border: none;
}

/* DESCRIPTION SPACE */
.description-area {
    width: 100%;
    max-width: 680px;
    margin: 20px auto;
    padding: 20px 15px;
    color: #f5f5ff;
    font-size: 16px;
    line-height: 1.8;
}

/* COPYRIGHT FOOTER */
.site-footer {
    width: 100%;
    padding: 35px 10px 25px;
    text-align: center;
    color: #f5f5ff;
    font-size: 13px;
    letter-spacing: 1.5px;
    line-height: 2;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
}

.site-footer .brand-name {
    font-size: 16px;
    letter-spacing: 3px;
}

/* MOBILE DISPLAY */
@media (max-width: 600px) {
    .brand-hero {
        background-size: 220px auto;
    }

    .collection-section {
        padding: 50px 12px 30px;
    }

    .collection h2,
    .one-of-one-display h2 {
        font-size: 16px;
        letter-spacing: 2px;
    }

    .logo-frame {
        padding: 10px;
    }
}
</style>
</head>

<body>

<!-- FIRST SCREEN: MELLOWAY BRANDING -->
<section class="brand-hero">

    <header class="header-logo">
        <img
            src="./file_000000003744820bb906eade10d0589d.png"
            alt="MELLOWAY Main Logo">
    </header>

</section>

<!-- SECOND SECTION: COLLECTIONS -->
<section class="collection-section">

    <main class="collections">

        <a href="gold.html" class="collection">
            <h2>GOLD</h2>
        </a>

        <a href="silver.html" class="collection">
            <h2>SILVER</h2>
        </a>

        <a href="bronze.html" class="collection">
            <h2>BRONZE</h2>
        </a>

        <a href="platinum.html" class="collection">
            <h2>PLATINUM</h2>
        </a>

        <!-- ONE OF ONE: NOT CLICKABLE -->
        <div class="one-of-one-display">

            <h2>ONE OF ONE</h2>

            <div class="logo-frame">
                <img
                    src="./file_00000000988481fa9fe31c67b67da2cb.jpg"
                    alt="MELLOWAY Pearl White Digital Logo">
            </div>

        </div>

    </main>

    <!-- DESCRIPTION TO BE ADDED HERE -->
    <section class="description-area">
        <!-- Your MELLOWAY description will go here -->
    </section>

    <!-- COPYRIGHT FOOTER -->
    <footer class="site-footer">
        <div class="brand-name">MELLOWAY™</div>
        <div>© 2026 Cally Jane Melloway. All rights reserved.</div>
    </footer>

</section>

</body>
</html>
