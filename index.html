<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MELLOWAY</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background-color: #07152e;
    background-image: url('./melloway-blue-pattern.jpg');
    background-position: top center;
    background-repeat: repeat;
    background-size: 280px auto;
    font-family: Georgia, serif;
    text-align: center;
    color: #f5f5ff;
}

/* MAIN MELLOWAY LOGO */
.header-logo img {
    display: block;
    width: 100%;
    max-width: 1024px;
    height: auto;
    margin: 0 auto;
}

/* PAGE CONTENT */
.pattern-area {
    width: 100%;
    min-height: 100vh;
    padding: 30px 15px 40px;
}

/* COLLECTION LAYOUT */
.collections {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 25px 15px;
}

/* CLICKABLE COLLECTIONS */
.collection {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 75px;
    text-decoration: none;
}

/* PLATINUM WHITE HEADINGS */
.collection h2,
.one-of-one-display h2 {
    margin: 0;
    color: #f5f5ff;
    font-size: 21px;
    font-weight: normal;
    letter-spacing: 3px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.65);
}

/* ONE OF ONE DISPLAY */
.one-of-one-display {
    grid-column: 1 / -1;
    width: 100%;
    padding: 30px 10px 40px;
    text-align: center;
}

/* FRAMED PEARL WHITE DIGITAL LOGO */
.one-of-one-display img {
    display: block;
    width: 100%;
    max-width: 420px;
    height: auto;
    margin: 25px auto;
    border: 8px solid #080808;
    outline: 2px solid #c0c0c0;
    outline-offset: 3px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.65);
}

/* DESCRIPTION SPACE */
.description-area {
    max-width: 680px;
    margin: 20px auto;
    padding: 20px 15px;
    color: #f5f5ff;
    font-size: 16px;
    line-height: 1.8;
}

/* COPYRIGHT FOOTER */
.site-footer {
    width: 100%;
    padding: 30px 10px 25px;
    text-align: center;
    color: #f5f5ff;
    font-size: 13px;
    letter-spacing: 1.5px;
    line-height: 2;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
}

.site-footer .brand-name {
    font-size: 16px;
    letter-spacing: 3px;
}

@media (max-width: 600px) {
    body {
        background-size: 220px auto;
    }

    .pattern-area {
        padding: 25px 12px 30px;
    }

    .collection h2,
    .one-of-one-display h2 {
        font-size: 16px;
        letter-spacing: 2px;
    }

    .one-of-one-display img {
        border-width: 6px;
    }
}
</style>
</head>

<body>

<header class="header-logo">
    <img
        src="./file_000000003744820bb906eade10d0589d.png"
        alt="MELLOWAY Main Logo">
</header>

<section class="pattern-area">

    <main class="collections">

        <a href="gold.html" class="collection">
            <h2>GOLD</h2>
        </a>

        <a href="silver.html" class="collection">
            <h2>SILVER</h2>
        </a>

        <a href="bronze.html" class="collection">
            <h2>BRONZE</h2>
        </a>

        <a href="platinum.html" class="collection">
            <h2>PLATINUM</h2>
        </a>

        <!-- ONE OF ONE: STATIC DISPLAY -->
        <div class="one-of-one-display">
            <h2>ONE OF ONE</h2>

            <img
                src="./file_00000000988481fa9fe31c67b67da2cb.jpg"
                alt="MELLOWAY Pearl White Digital Logo">
        </div>

    </main>

    <!-- DESCRIPTION WILL GO HERE -->

    <section class="description-area">
        <!-- We will add your description here -->
    </section>

    <!-- COPYRIGHT FOOTER -->
    <footer class="site-footer">
        <div class="brand-name">MELLOWAY™</div>
        <div>© 2026 Cally Jane Melloway. All rights reserved.</div>
    </footer>

</section>

</body>
</html>
