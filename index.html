<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELLOWAY</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    width: 100%;
}

body {
    background-color: #07152e;
    font-family: Georgia, serif;
    text-align: center;
    color: #ffffff;
}

/* LARGE MELLOWAY LOGO */
.header-logo {
    width: 100%;
    display: block;
    margin: 0 auto;
}

.header-logo img {
    display: block;
    width: 100%;
    max-width: 1024px;
    height: auto;
    margin: 0 auto;
}

/* SMALL M/X BACKGROUND PATTERN */
.pattern-area {
    width: 100%;
    min-height: 100vh;
    background-image: url('./melloway-blue-pattern.jpg');
    background-position: top center;
    background-repeat: repeat;
    background-size: 280px auto;
    padding: 35px 15px 100px;
}

/* COLLECTION LINKS */
.collections {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 35px 15px;
}

.collection {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80px;
    text-decoration: none;
    background: transparent;
}

/* ALL COLLECTION NAMES IN PLATINUM WHITE */
.collection h2 {
    margin: 0;
    font-size: 21px;
    font-weight: normal;
    letter-spacing: 3px;
    color: #f5f5ff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.65);
}

.one-of-one {
    grid-column: 1 / -1;
}

/* MOBILE DISPLAY */
@media (max-width: 600px) {
    .pattern-area {
        background-size: 220px auto;
        padding: 25px 12px 80px;
    }

    .collection h2 {
        font-size: 16px;
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>

<header class="header-logo">
    <img
        src="./file_000000003744820bb906eade10d0589d.png"
        alt="MELLOWAY logo">
</header>

<section class="pattern-area">

    <div class="collections">

        <a href="gold.html" class="collection">
            <h2>GOLD</h2>
        </a>

        <a href="silver.html" class="collection">
            <h2>SILVER</h2>
        </a>

        <a href="bronze.html" class="collection">
            <h2>BRONZE</h2>
        </a>

        <a href="platinum.html" class="collection">
            <h2>PLATINUM</h2>
        </a>

        <a href="one-of-one.html" class="collection one-of-one">
            <h2>ONE OF ONE</h2>
        </a>

    </div>

</section>

</body>
</html>
