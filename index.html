
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MELLOWAY</title>
    <meta name="description" content="MELLOWAY — original art and exclusive creative works.">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: #514147;
            font-family: Georgia, serif;
            text-align: center;
            background: #f8f5f1;
        }

        /* PEARL BACKGROUND WITH SMALL M PATTERN */
        .pearl-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-color: #f8f5f1;
            background-image: url('./file_0000000092f082089bd7a86778879bd3.png');
            background-position: center top;
            background-size: 100% auto;
            background-repeat: repeat-y;
            pointer-events: none;
        }

        /* ORIGINAL BIG MELLOWAY LOGO AT THE TOP */
        header {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 55vh;
            min-height: 320px;
            background-image: url('./file_00000000988481fa9fe31c67b67da2cb.jpg');
            background-position: center top;
            background-size: auto 100%;
            background-repeat: no-repeat;
        }

        /* COLLECTION AREA */
        main {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 10px 20px 70px;
        }

        /* COLLECTION LINKS */
        .collections {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        .collection {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 105px;
            padding: 24px 12px;
            background: rgba(255, 253, 250, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 3px;
            box-shadow:
                0 4px 16px rgba(83, 60, 65, 0.035),
                inset 0 1px 1px rgba(255, 255, 255, 0.55);
            text-decoration: none;
            transition:
                background 0.35s ease,
                border-color 0.35s ease,
                transform 0.35s ease,
                box-shadow 0.35s ease;
        }

        .collection:hover {
            background: rgba(255, 253, 250, 0.7);
            border-color: rgba(128, 0, 32, 0.2);
            box-shadow: 0 6px 20px rgba(83, 60, 65, 0.07);
            transform: translateY(-2px);
        }

        .collection h2 {
            margin: 0;
            font-size: 21px;
            font-weight: normal;
            letter-spacing: 3px;
            line-height: 1.4;
        }

        .gold h2 {
            color: #a78320;
        }

        .silver h2 {
            color: #777777;
        }

        .bronze h2 {
            color: #a65e2b;
        }

        .platinum h2 {
            color: #77716d;
        }

        .one-of-one h2 {
            color: #800020;
            letter-spacing: 2px;
        }

        .one-of-one {
            grid-column: 1 / -1;
            width: calc(50% - 9px);
            justify-self: center;
            min-height: 90px;
        }

        /* MOBILE DISPLAY */
        @media (max-width: 600px) {
            header {
                height: 48vh;
                min-height: 280px;
                background-size: auto 100%;
                background-position: center top;
            }

            main {
                padding: 10px 14px 45px;
            }

            .collections {
                gap: 12px;
            }

            .collection {
                min-height: 88px;
                padding: 18px 8px;
            }

            .collection h2 {
                font-size: 16px;
                letter-spacing: 1.5px;
            }

            .one-of-one {
                min-height: 78px;
            }

            .one-of-one h2 {
                letter-spacing: 1.5px;
            }
        }

        /* ACCESSIBILITY */
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .collection {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div class="pearl-background" aria-hidden="true"></div>

    <header aria-label="MELLOWAY brand logo"></header>

    <main>
        <div class="collections">

            <a href="gold.html" class="collection gold">
                <h2>GOLD</h2>
            </a>

            <a href="silver.html" class="collection silver">
                <h2>SILVER</h2>
            </a>

            <a href="bronze.html" class="collection bronze">
                <h2>BRONZE</h2>
            </a>

            <a href="platinum.html" class="collection platinum">
                <h2>PLATINUM</h2>
            </a>

            <a href="one-of-one.html" class="collection one-of-one">
                <h2>ONE OF ONE</h2>
            </a>

        </div>
    </main>

</body>
</html>
