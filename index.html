<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MELLOWAY</title>
<meta name="description" content="MELLOWAY — original art and exclusive creative works.">

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    text-align: center;
    color: #e5e4ec;

    /* FULL PAGE BLUE PEARL BACKGROUND */
    background-color: #07152e;
    background-image: url('./melloway-blue-pattern.jpg');
    background-position: center top;
    background-size: 100% auto;
    background-repeat: repeat;
}

/* ORIGINAL MELLOWAY LOGO */
header {
    width: 100%;
    margin: 0 auto;
    padding: 0;
}

header img {
    display: block;
    width: 100%;
    max-width: 1024px;
    height: auto;
    margin: 0 auto;
}

/* COLLECTIONS */
main {
    width: 100%;
    min-height: 600px;
    padding: 35px 20px 100px;
    background: transparent;
}

.collections {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 30px 18px;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
}

.collection {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 90px;
    padding: 15px 8px;
    background: transparent;
    border: none;
    text-decoration: none;
    transition: transform 0.3s ease;
}

.collection:hover {
    transform: translateY(-3px);
}

.collection h2 {
    margin: 0;
    font-size: 21px;
    font-weight: normal;
    letter-spacing: 3px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.65);
}

.gold h2 {
    color: #d4af37;
}

.silver h2 {
    color: #e0e3ed;
}

.bronze h2 {
    color: #cd7f32;
}

.platinum h2 {
    color: #f0f1f5;
}

.one-of-one {
    grid-column: 1 / -1;
}

.one-of-one h2 {
    color: #c58ba0;
    letter-spacing: 3px;
}

/* MOBILE DISPLAY */
@media (max-width: 600px) {
    header img {
        width: 100%;
    }

    main {
        padding: 25px 14px 70px;
        min-height: 600px;
    }

    .collections {
        gap: 20px 10px;
    }

    .collection {
        min-height: 75px;
    }

    .collection h2 {
        font-size: 16px;
        letter-spacing: 1.8px;
    }
}

/* ACCESSIBILITY */
@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }

    .collection {
        transition: none;
    }
}
</style>
</head>

<body>

<header aria-label="MELLOWAY brand logo">
    <img
        src="./file_000000003744820bb906eade10d0589d.png"
        alt="MELLOWAY original interlocking M X logo">
</header>

<main>
    <div class="collections">

        <a href="gold.html" class="collection gold">
            <h2>GOLD</h2>
        </a>

        <a href="silver.html" class="collection silver">
            <h2>SILVER</h2>
        </a>

        <a href="bronze.html" class="collection bronze">
            <h2>BRONZE</h2>
        </a>

        <a href="platinum.html" class="collection platinum">
            <h2>PLATINUM</h2>
        </a>

        <a href="one-of-one.html" class="collection one-of-one">
            <h2>ONE OF ONE</h2>
        </a>

    </div>
</main>

</body>
</html>
