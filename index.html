<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MELLOWAY</title>
<meta name="description" content="MELLOWAY — original art and exclusive creative works.">

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    background: #07152e;
    color: #e5e4ec;
}

/* TOP BRAND AREA */
.brand-hero {
    width: 100%;
    min-height: 65vh;
    padding: 35px 18px 45px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background-color: #07152e;
    background-image: url('./melloway-blue-pattern.jpg');
    background-position: center top;
    background-repeat: repeat;
    background-size: 280px auto;
}

/* MAIN MELLOWAY LOGO */
.logo-container {
    width: 100%;
    max-width: 1024px;
    margin: 0 auto;
    text-align: center;
}

.logo-container img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 auto;
}

/* CLEAN SEPARATE LOWER SECTION */
.lower-section {
    width: 100%;
    min-height: 35vh;
    padding: 40px 20px;
    background: #07152e;
}

/* MOBILE DISPLAY */
@media (max-width: 600px) {
    .brand-hero {
        min-height: 55vh;
        padding: 22px 12px 35px;
        background-size: 220px auto;
    }

    .logo-container {
        width: 100%;
    }

    .lower-section {
        min-height: 45vh;
    }
}

/* ACCESSIBILITY */
@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }
}
</style>
</head>

<body>

<section class="brand-hero">
    <header class="logo-container">
        <img
            src="./file_000000003744820bb906eade10d0589d.png"
            alt="MELLOWAY original interlocking M logo">
    </header>
</section>

<main class="lower-section">
    <!-- Separate artwork collections will be displayed on their own pages. -->
</main>

</body>
</html>
