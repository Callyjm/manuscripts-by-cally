<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MELLOWAY — One of One</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    width: 100%;
}

body {
    background-color: #07152e;
    background-image: url('./melloway-blue-pattern.jpg');
    background-position: top center;
    background-repeat: repeat;
    background-size: 280px auto;
    font-family: Georgia, serif;
    text-align: center;
    color: #f5f5ff;
}

/* PAGE HEADING */
h1 {
    margin: 35px 10px 15px;
    font-size: 25px;
    font-weight: normal;
    letter-spacing: 5px;
    color: #f5f5ff;
}

/* ONE OF ONE DIGITAL LOGO */
.one-of-one-display {
    width: 100%;
    padding: 20px 15px 80px;
    text-align: center;
}

.one-of-one-display img {
    display: block;
    width: 100%;
    max-width: 650px;
    height: auto;
    margin: 20px auto;
}

/* MOBILE DISPLAY */
@media (max-width: 600px) {
    h1 {
        font-size: 21px;
        letter-spacing: 3px;
    }

    .one-of-one-display {
        padding: 15px 10px 60px;
    }
}
</style>
</head>

<body>

<h1>ONE OF ONE</h1>

<main class="one-of-one-display">

    <img
        src="./file_00000000988481fa9fe31c67b67da2cb.jpg"
        alt="MELLOWAY Pearl White Digital Logo">

</main>

</body>
</html>
