<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MELLOWAY — GOLD</title>

<style>
* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    margin: 0;
    padding: 0;
    background: #07152e;
    color: #f5f6ff;
    font-family: Georgia, serif;
    text-align: center;
}

/* REPEATING MELLOWAY MONOGRAM BACKGROUND */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;

    background-image:
        url('./file_000000003744820bb906eade10d0589d.png');

    background-repeat: repeat;
    background-position: center top;
    background-size: 95px auto;

    opacity: 0.12;
}

/* HEADER */
header {
    padding: 50px 20px 30px;
}

h1 {
    margin: 0;
    color: #f5f6ff;
    font-size: 48px;
    font-weight: normal;
    letter-spacing: 8px;
    text-shadow: 0 0 8px rgba(255,255,255,0.25);
}

.subtitle {
    margin-top: 15px;
    color: #f5f6ff;
    font-size: 16px;
    letter-spacing: 4px;
}

/* ARTWORK */
main {
    max-width: 900px;
    margin: auto;
    padding: 20px 20px 60px;
}

.artwork {
    margin: 10px auto 40px;
}

.artwork img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 55vh;
    object-fit: contain;
    margin: 0 auto;
    border: 1px solid #dce0ed;
}

.artwork-title {
    margin-top: 22px;
    color: #f5f6ff;
    font-size: 20px;
    letter-spacing: 3px;
}

/* BACK LINK */
.back {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 26px;
    border: 1px solid #cbd0df;
    color: #f5f6ff;
    text-decoration: none;
    letter-spacing: 2px;
    transition: background 0.3s ease;
}

.back:hover {
    background: rgba(255,255,255,0.10);
}

/* FOOTER */
footer {
    padding: 30px 20px;
    color: #f5f6ff;
    font-size: 13px;
    letter-spacing: 3px;
}

/* MOBILE */
@media (max-width: 600px) {
    header {
        padding-top: 40px;
    }

    h1 {
        font-size: 38px;
        letter-spacing: 6px;
    }

    .subtitle {
        font-size: 14px;
        letter-spacing: 3px;
    }

    .artwork img {
        max-height: 50vh;
    }
}
</style>
</head>

<body>

<header>
    <h1>GOLD</h1>
    <div class="subtitle">MELLOWAY — CALLY</div>
</header>

<main>

    <div class="artwork">
        <img
            src="IMG_20261014_165031.jpg"
            alt="Original MELLOWAY Gold Collection artwork"
        >

        <div class="artwork-title">
            ORIGINAL ARTWORK
        </div>
    </div>

    <a href="index.html#art" class="back">
        BACK TO ART
    </a>

</main>

<footer>
    MELLOWAY
</footer>

</body>
</html>
