<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MELLOWAY — GOLD</title>

    <style>
        body {
            background: #111111;
            color: #f5f5f5;
            font-family: Georgia, serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            padding: 50px 20px 30px;
        }

        h1 {
            font-size: 48px;
            letter-spacing: 8px;
            color: #d4af37;
            margin: 0;
        }

        .subtitle {
            font-size: 16px;
            letter-spacing: 4px;
            margin-top: 15px;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 20px 20px 60px;
        }

        .artwork {
            margin: 10px auto 40px;
        }

        .artwork img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 55vh;
            object-fit: contain;
            margin: 0 auto;
            border: 1px solid #d4af37;
            box-sizing: border-box;
        }

        .artwork-title {
            color: #d4af37;
            font-size: 20px;
            letter-spacing: 3px;
            margin-top: 22px;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 26px;
            border: 1px solid #555555;
            color: #f5f5f5;
            text-decoration: none;
            letter-spacing: 2px;
        }

        .back:hover {
            background: #222222;
        }

        footer {
            padding: 30px 20px;
            font-size: 13px;
            letter-spacing: 3px;
            color: #d4af37;
        }

        @media (max-width: 600px) {
            header {
                padding-top: 40px;
            }

            h1 {
                font-size: 38px;
                letter-spacing: 6px;
            }

            .subtitle {
                font-size: 14px;
                letter-spacing: 3px;
            }

            .artwork img {
                max-height: 50vh;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>GOLD</h1>
        <div class="subtitle">MELLOWAY — CALLY</div>
    </header>

    <main>

        <div class="artwork">
            <img
                src="IMG_20261014_165031.jpg"
                alt="Original MELLOWAY Gold Collection artwork"
            >

            <div class="artwork-title">
                ORIGINAL ARTWORK
            </div>
        </div>

        <a href="index.html#art" class="back">
            BACK TO ART
        </a>

    </main>

    <footer>
        MELLOWAY
    </footer>

</body>
</html>
