<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MELLOWAY — PLATINUM</title>

<style>
* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    margin: 0;
    padding: 0;
    background: #07152e;
    color: #f5f6ff;
    font-family: Georgia, serif;
    text-align: center;
}

/* REPEATING MELLOWAY MONOGRAM BACKGROUND */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;

    background-image:
        url('./file_000000003744820bb906eade10d0589d.png');

    background-repeat: repeat;
    background-position: center top;
    background-size: 95px auto;

    opacity: 0.12;
}

/* HEADER */
header {
    padding: 70px 20px 40px;
}

h1 {
    margin: 0;
    color: #f5f6ff;
    font-size: 56px;
    font-weight: normal;
    letter-spacing: 8px;
    text-shadow: 0 0 8px rgba(255,255,255,0.25);
}

.subtitle {
    margin-top: 15px;
    color: #f5f6ff;
    font-size: 18px;
    letter-spacing: 4px;
}

/* PLATINUM ARTWORK PRESENTATION */
main {
    max-width: 900px;
    margin: auto;
    padding: 30px 20px 80px;
}

.artwork {
    max-width: 700px;
    margin: 50px auto;
    padding: 35px 25px;
    border: 1px solid #cbd0df;
    background: rgba(7, 21, 46, 0.65);
}

.artwork-image {
    height: 450px;
    border: 1px solid #cbd0df;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f5f6ff;
    letter-spacing: 2px;
    margin-bottom: 30px;
}

.artwork h2 {
    color: #f5f6ff;
    font-size: 28px;
    letter-spacing: 3px;
    font-weight: normal;
}

.artwork p {
    color: #f5f6ff;
    font-size: 17px;
    line-height: 1.8;
}

.details {
    color: #f5f6ff;
    font-size: 15px;
    letter-spacing: 1px;
}

/* BACK LINK */
.back {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 30px;
    border: 1px solid #cbd0df;
    color: #f5f6ff;
    text-decoration: none;
    letter-spacing: 2px;
    transition: background 0.3s ease;
}

.back:hover {
    background: rgba(255,255,255,0.10);
}

/* FOOTER */
footer {
    padding: 40px 20px;
    color: #f5f6ff;
    font-size: 14px;
    letter-spacing: 2px;
}

/* MOBILE */
@media (max-width: 600px) {
    header {
        padding-top: 40px;
    }

    h1 {
        font-size: 42px;
        letter-spacing: 6px;
    }

    .subtitle {
        font-size: 14px;
        letter-spacing: 3px;
    }

    .artwork {
        padding: 22px 15px;
    }

    .artwork-image {
        height: 300px;
    }

    .artwork h2 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<header>
    <h1>PLATINUM</h1>
    <div class="subtitle">MELLOWAY — CALLY</div>
</header>

<main>

    <div class="artwork">

        <div class="artwork-image">
            YOUR PLATINUM ARTWORK IMAGE
        </div>

        <h2>MELLOWAY — PLATINUM 001</h2>

        <p>
            Artwork title
        </p>

        <div class="details">
            Original artwork · 2026
        </div>

    </div>

    <a href="index.html#art" class="back">
        BACK TO ART
    </a>

</main>

<footer>
    MELLOWAY
</footer>

</body>
</html>
